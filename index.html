<!DOCTYPE html>
<html lang="vi" class="dark scroll-smooth" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nguyễn Thị Thùy Dương — Software Engineer</title>
  <meta name="theme-color" content="#06090F">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Theme early init to avoid flash -->
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      var t;
      try { t = localStorage.getItem('theme'); } catch (e) { }
      if (t !== 'light' && t !== 'dark') t = 'dark';
      d.setAttribute('data-theme', t);
      if (t === 'dark') {
        d.classList.add('dark');
      } else {
        d.classList.remove('dark');
      }
      var meta = d.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', t === 'light' ? '#f8fafc' : '#06090F');
    })();
  </script>
</head>

<body
  class="bg-slate-50 text-slate-900 dark:bg-[#06090F] dark:text-slate-100 font-sans antialiased selection:bg-amber-500 selection:text-slate-950 transition-colors duration-300">
  <div id="app"></div>
  <noscript>Trang này cần bật JavaScript để hiển thị. Bạn có thể <a href="/cv-thuyduong.pdf" download="NguyenThiThuyDuong_SoftwareEngineer.pdf">tải CV của Nguyễn Thị Thùy Dương (PDF)</a>.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
